<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Standard">
<meta name="theme-color" content="#0E0E10">
<title>The Standard</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header>
  <div class="title-row">
    <h1>The Standard</h1>
    <button class="review-btn" id="tomorrowBtn">⏰ Tomorrow</button>
  </div>
</header>

<div class="legend" id="legend" style="display:none"></div>

<div id="tabViewport">
<div id="tabTrack">

<div id="dashboardSection">
  <div id="dashboardContent"></div>
</div>

<div id="calendarSection">
  <div class="week-nav">
    <button class="week-nav-btn" id="prevWeek" aria-label="Previous week">‹</button>
    <button class="week-label-btn" id="calendarBtn">
      <span class="eyebrow" id="weekLabel">Week of —</span>
      <span class="caret">▾</span>
    </button>
    <button class="week-nav-btn" id="nextWeek" aria-label="Next week">›</button>
  </div>
  <div class="day-tabs" id="dayTabs"></div>

  <div id="allDayBanners"></div>
  <div id="fixedBanners"></div>

  <div class="view-toggle">
    <button id="btnToday">Today</button>
    <button id="btnBlock" class="active">Blocks</button>
    <button id="btnList">List</button>
  </div>

  <div id="todayView"></div>
  <div id="blockView"></div>
  <div id="listView"></div>
</div>

<div id="tasksSection">
  <div id="taskSection"></div>
</div>

<div id="habitsSection">
  <div id="habitsContent"></div>
</div>

</div>
</div>

<div id="listsSection" style="display:none">
  <div id="listsContent"></div>
</div>

<div id="longGoalsSection" style="display:none">
  <div id="longGoalsContent"></div>
</div>

<div id="fitnessSection" style="display:none">
  <div id="fitnessContent"></div>
</div>

<div id="budgetSection" style="display:none">
  <div id="budgetContent"></div>
</div>

<div id="projectsSection" style="display:none">
  <div id="projectsContent"></div>
</div>

<div id="journalSection" style="display:none">
  <div id="journalContent"></div>
</div>

<div id="scoresSection" style="display:none">
  <div id="scoresContent"></div>
</div>

<div id="emailSection" style="display:none">
  <div id="emailContent"></div>
</div>

<div id="settingsSection" style="display:none">
  <div id="settingsContent"></div>
</div>

<button class="fab-btn" id="fabBtn" aria-label="Add">+</button>
<button class="goldie-btn" id="goldieBtn" aria-label="Goldie — quick add"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.5 6.2l6.5.6l-5 4.4l1.5 6.3l-5.5-3.4l-5.5 3.4l1.5-6.3l-5-4.4l6.5-.6z"/></svg></button>

<nav id="bottomNav">
  <button class="bottom-nav-btn active" data-section="dashboard">
    <span class="bn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></span><span>Home</span>
  </button>
  <button class="bottom-nav-btn" data-section="calendar">
    <span class="bn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18"/><path d="M8 3v3"/><path d="M16 3v3"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg></span><span>Calendar</span>
  </button>
  <button class="bottom-nav-btn" data-section="tasks">
    <span class="bn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l2.5 2.5l5.5-6"/></svg></span><span>Tasks</span>
  </button>
  <button class="bottom-nav-btn" data-section="habits">
    <span class="bn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.2-6"/><path d="M17.5 2.8v4.2h-4.2"/><path d="M20 12a8 8 0 0 1-13.2 6"/><path d="M6.5 21.2V17h4.2"/></svg></span><span>Habits</span>
  </button>
  <button class="bottom-nav-btn" id="moreNavBtn">
    <span class="bn-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/></svg></span><span>More</span>
  </button>
</nav>

<datalist id="classSuggestions"></datalist>

<!-- Popover menu for a category's ⋮ options -->
<div class="cat-menu hidden" id="catMenu">
  <button id="catMenuAddEvent"><span class="ic">▤</span> Add event</button>
  <button id="catMenuAddTask"><span class="ic">✓</span> Add task</button>
  <button id="catMenuQuickAdd"><span class="ic">»</span> Quick add</button>
  <div class="menu-divider"></div>
  <button id="catMenuUpcoming"><span class="ic">›</span> View upcoming</button>
</div>

<!-- Shared modal overlay. The slide animation lives on .modal-slide,
     separate from #modalContent's own overflow-y:auto — see the CSS
     comment on .modal-slide for why they can't be the same element. -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-slide"><div class="modal" id="modalContent"></div></div>
</div>

<!-- Custom select picker sheet — stacks above modalOverlay so it can open
     from inside an already-open modal (e.g. picking a category while
     adding a transaction) without closing it. -->
<div class="modal-overlay picker-overlay hidden" id="pickerOverlay">
  <div class="modal-slide"><div class="modal" id="pickerContent"></div></div>
</div>

<script src="script.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>

</body>
</html>
